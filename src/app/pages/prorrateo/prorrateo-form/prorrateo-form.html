<form class="card flex flex-col gap-6 w-full" [formGroup]="formGroup" (ngSubmit)="onClickGuardar()">

    <div class="flex gap-3 w-full">
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-select id="on_idUnidad" [options]="unidades" optionLabel="label" optionValue="value" [filter]="true" formControlName="idUnidad" class="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['idUnidad'].errors }" appendTo="body" />
                <label for="on_idUnidad">Unidad</label>
            </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-select id="on_tipoServicio" [options]="servicios" optionLabel="label" optionValue="value" formControlName="tipoServicio" class="w-full" appendTo="body" />
                <label for="on_tipoServicio">Servicio</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <input pInputText id="on_periodo" autocomplete="off" formControlName="periodo" placeholder="2026-09" class="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['periodo'].errors }" />
            <label for="on_periodo">Periodo (AAAA-MM)</label>
        </p-floatlabel>
    </div>

    <div class="flex gap-3 w-full">
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-inputnumber id="on_consumoIndividual" formControlName="consumoIndividual" [minFractionDigits]="2" [maxFractionDigits]="2" class="w-full" inputStyleClass="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['consumoIndividual'].errors }" />
                <label for="on_consumoIndividual">Consumo propio</label>
            </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-inputnumber id="on_consumoComunAsignado" formControlName="consumoComunAsignado" [minFractionDigits]="2" [maxFractionDigits]="2" class="w-full" inputStyleClass="w-full" />
                <label for="on_consumoComunAsignado">Común asignado</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="flex gap-3 w-full">
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-inputnumber id="on_costoUnitario" formControlName="costoUnitario" mode="currency" currency="PEN" locale="es-PE" [minFractionDigits]="4" [maxFractionDigits]="4" class="w-full" inputStyleClass="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['costoUnitario'].errors }" />
                <label for="on_costoUnitario">Costo unitario</label>
            </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-inputnumber id="on_montoCalculado" formControlName="montoCalculado" mode="currency" currency="PEN" locale="es-PE" class="w-full" inputStyleClass="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['montoCalculado'].errors }" />
                <label for="on_montoCalculado">Monto (auto)</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="flex justify-center gap-3 mt-2">
        <p-button label="Guardar" icon="pi pi-check" type="submit" />
    </div>
</form>
