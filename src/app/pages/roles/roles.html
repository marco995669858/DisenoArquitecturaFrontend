<div class="card">
    <div class="font-semibold text-xl mb-4">ROLES</div>
    <p-toolbar class="mb-6">
        <ng-template #start></ng-template>
        <ng-template #end>
            @if (permisosService.puedeEscribir('ROLES')) {
            <p-button label="Agregar Rol" icon="pi pi-plus" (onClick)="openModal()" />
            }
        </ng-template>
    </p-toolbar>
    <p-table #dt1 [value]="roles" dataKey="idRol" [rows]="10" [rowHover]="true" [showGridlines]="true"
        [paginator]="true" [globalFilterFields]="['nombre']" [rowsPerPageOptions]="[10, 25, 50]" responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Limpiar" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon><i class="pi pi-search"></i></p-inputicon>
                    <input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Buscar roles" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="min-width: 5rem">N°</th>
                <th style="min-width: 14rem">Nombre</th>
                <th style="min-width: 10rem">Acciones</th>
            </tr>
        </ng-template>
        <ng-template #body let-rol let-i="rowIndex">
            <tr>
                <td>{{ i + 1 }}</td>
                <td class="font-semibold">{{ rol.nombre }}</td>
                <td>
                    @if (permisosService.puedeEscribir('ROLES')) {
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="openModal(rol)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="onClicAbrirDialogoEliminar(rol.idRol)" />
                    }
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr><td colspan="3">No existen roles registrados.</td></tr>
        </ng-template>
    </p-table>
</div>
