<form class="card flex flex-col gap-6 w-full" [formGroup]="formGroup" (ngSubmit)="onClickGuardar()">

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <p-password id="on_passwordNueva" formControlName="passwordNueva" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['passwordNueva'].errors }" />
            <label for="on_passwordNueva">Contraseña nueva</label>
        </p-floatlabel>
        @if (submite && f['passwordNueva'].errors) {
        <div class="text-red-500 text-sm ml-2 mt-1"><span>Debe tener al menos 8 caracteres.</span></div>
        }
    </div>

    <div class="flex justify-center gap-3 mt-2">
        <p-button label="Guardar" icon="pi pi-check" type="submit" />
    </div>
</form>
