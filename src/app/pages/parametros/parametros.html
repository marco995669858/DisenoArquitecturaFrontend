<div class="card">
    <div class="font-semibold text-xl mb-4">PARÁMETROS DEL SISTEMA</div>
    <p-toolbar class="mb-6">
        <ng-template #start></ng-template>
        <ng-template #end>
            @if (permisosService.puedeEscribir('PARAMETROS')) {
            <p-button label="Agregar Parámetro" icon="pi pi-plus" (onClick)="openModal()" />
            }
        </ng-template>
    </p-toolbar>
    <p-table #dt1 [value]="parametros" dataKey="idParametro" [rows]="10" [rowHover]="true" [showGridlines]="true"
        [paginator]="true" [globalFilterFields]="['clave', 'valor', 'descripcion']" [rowsPerPageOptions]="[10, 25, 50]" responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Limpiar" class="p-button-outlined mb-2" icon="pi pi-filter-slash" (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon><i class="pi pi-search"></i></p-inputicon>
                    <input pInputText type="text" #filter (input)="onGlobalFilter(dt1, $event)" placeholder="Buscar parámetros" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="min-width: 5rem">N°</th>
                <th style="min-width: 12rem">Clave</th>
                <th style="min-width: 8rem">Valor</th>
                <th style="min-width: 16rem">Descripción</th>
                <th style="min-width: 10rem">Acciones</th>
            </tr>
        </ng-template>
        <ng-template #body let-parametro let-i="rowIndex">
            <tr>
                <td>{{ i + 1 }}</td>
                <td class="font-semibold">{{ parametro.clave }}</td>
                <td>{{ parametro.valor }}</td>
                <td>{{ parametro.descripcion }}</td>
                <td>
                    @if (permisosService.puedeEscribir('PARAMETROS')) {
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true" (click)="openModal(parametro)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true" (click)="onClicAbrirDialogoEliminar(parametro.idParametro)" />
                    }
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr><td colspan="5">No existen parámetros registrados.</td></tr>
        </ng-template>
    </p-table>
</div>
