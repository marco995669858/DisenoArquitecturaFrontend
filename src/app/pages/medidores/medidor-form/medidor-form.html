<form class="card flex flex-col gap-6 w-full" [formGroup]="formGroup" (ngSubmit)="onClickGuardar()">

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <p-select id="on_tipoServicio" [options]="servicios" optionLabel="label" optionValue="value" formControlName="tipoServicio" class="w-full" appendTo="body" />
            <label for="on_tipoServicio">Servicio</label>
        </p-floatlabel>
    </div>

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <p-select id="on_tipoMedidor" [options]="tipos" optionLabel="label" optionValue="value" formControlName="tipoMedidor" class="w-full" appendTo="body" />
            <label for="on_tipoMedidor">Tipo de medidor</label>
        </p-floatlabel>
    </div>

    @if (f['tipoMedidor'].value === 'INDIVIDUAL') {
    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <p-select id="on_idUnidad" [options]="unidades" optionLabel="label" optionValue="value" [filter]="true" formControlName="idUnidad" class="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['idUnidad'].errors }" appendTo="body" />
            <label for="on_idUnidad">Unidad</label>
        </p-floatlabel>
    </div>
    }

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <input pInputText id="on_numeroSerie" autocomplete="off" formControlName="numeroSerie" class="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['numeroSerie'].errors }" />
            <label for="on_numeroSerie">Número de serie</label>
        </p-floatlabel>
        @if (submite && f['numeroSerie'].errors) {
        <div class="text-red-500 text-sm ml-2 mt-1">
            @if (f['numeroSerie'].errors['required']) { <span>Ingrese el número de serie.</span> }
        </div>
        }
    </div>

    <div class="flex justify-center gap-3 mt-2">
        <p-button label="Guardar" icon="pi pi-check" type="submit" />
    </div>
</form>
