<form class="card flex flex-col gap-6 w-full" [formGroup]="formGroup" (ngSubmit)="onClickGuardar()">

    <div class="flex gap-3 w-full">
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <input pInputText id="on_periodo" autocomplete="off" formControlName="periodo" placeholder="2026-09" class="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['periodo'].errors }" />
                <label for="on_periodo">Periodo (AAAA-MM)</label>
            </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-select id="on_tipoServicio" [options]="servicios" optionLabel="label" optionValue="value" formControlName="tipoServicio" class="w-full" appendTo="body" />
                <label for="on_tipoServicio">Servicio</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <p-inputnumber id="on_montoTotal" formControlName="montoTotal" mode="currency" currency="PEN" locale="es-PE" class="w-full" inputStyleClass="w-full" [ngClass]="{ 'ng-dirty ng-invalid': submite && f['montoTotal'].errors }" />
            <label for="on_montoTotal">Monto total del recibo</label>
        </p-floatlabel>
        @if (submite && f['montoTotal'].errors) {
        <div class="text-red-500 text-sm ml-2 mt-1"><span>Ingrese el monto total del recibo.</span></div>
        }
    </div>

    <div class="flex gap-3 w-full">
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-datepicker id="on_fechaEmision" formControlName="fechaEmision" dateFormat="dd/mm/yy" [showIcon]="true" class="w-full" appendTo="body" />
                <label for="on_fechaEmision">Fecha de emisión</label>
            </p-floatlabel>
        </div>
        <div class="flex flex-col gap-1 w-full">
            <p-floatlabel variant="on">
                <p-datepicker id="on_fechaVencimiento" formControlName="fechaVencimiento" dateFormat="dd/mm/yy" [showIcon]="true" class="w-full" appendTo="body" />
                <label for="on_fechaVencimiento">Fecha de vencimiento</label>
            </p-floatlabel>
        </div>
    </div>

    <div class="flex flex-col gap-1 w-full">
        <p-floatlabel variant="on">
            <input pInputText id="on_rutaDocumento" autocomplete="off" formControlName="rutaDocumento" class="w-full" />
            <label for="on_rutaDocumento">Ruta del documento (opcional)</label>
        </p-floatlabel>
    </div>

    <div class="flex justify-center gap-3 mt-2">
        <p-button label="Guardar" icon="pi pi-check" type="submit" />
    </div>
</form>
