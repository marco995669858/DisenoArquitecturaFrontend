<div class="card">
    <div class="font-semibold text-xl mb-4">LISTADO DE ESTADO DE CITAS</div>
    <p-toolbar class="mb-6">
        <ng-template #start>
        </ng-template>
        <ng-template #end>
            <p-button label="Agregar Especialidad" icon="pi pi-plus" class="mr-2" (onClick)="openModal()" />
        </ng-template>
    </p-toolbar>
    <p-table #dt1 [value]="estadoCita" dataKey="id" [rows]="10" [rowHover]="true" [showGridlines]="true"
        [paginator]="true" [globalFilterFields]="['nombre']" [rowsPerPageOptions]="[10, 25, 50]"
        responsiveLayout="scroll">
        <ng-template #caption>
            <div class="flex justify-between items-center flex-column sm:flex-row">
                <button pButton label="Clear" class="p-button-outlined mb-2" icon="pi pi-filter-slash"
                    (click)="clear(dt1)"></button>
                <p-iconfield iconPosition="left" class="ml-auto">
                    <p-inputicon>
                        <i class="pi pi-search"></i>
                    </p-inputicon>
                    <input pInputText type="text" (input)="onGlobalFilter(dt1, $event)" placeholder="Buscar estado" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        N°
                    </div>
                </th>
                <th style="min-width: 12rem">
                    <div class="flex justify-between items-center">
                        Nombre
                    </div>
                </th>
                <th style="min-width: 14rem">
                    <div class="flex justify-between items-center">
                        Color
                    </div>
                </th>
                <th style="min-width: 10rem">
                    <div class="flex justify-between items-center">
                        Acciones
                    </div>
                </th>
            </tr>
        </ng-template>
        <ng-template #body let-estado let-i="rowIndex">
            <tr>

                <td>
                    {{i + 1}}
                </td>
                <td>
                    {{ estado.nombre | uppercase}}
                </td>
                <td>
                    <div class="w-6 h-6 rounded border border-gray-300 shadow-sm"
                        [style.backgroundColor]="estado.colorHex" [title]="estado.colorHex">
                    </div>
                </td>
                <td>
                    <p-button icon="pi pi-pencil" class="mr-2" [rounded]="true" [outlined]="true"
                        (click)="openModal(estado)" />
                    <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                        (click)="onClicAbrirDialogoEliminar(estado.idEstadoCita)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="4">No existe estado de citas.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
